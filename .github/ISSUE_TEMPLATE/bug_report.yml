name: 缺陷报告 / Bug Report
description: 报告可以稳定复现的 OdooCC 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要填写此表单，请按照 SECURITY.md 发送私密邮件。
        提交日志或截图前，请删除密码、令牌、微信身份标识、邮箱和其他敏感信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同报告。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
        - label: 我已从内容中删除凭据、个人信息和生产数据。
          required: true

  - type: input
    id: module
    attributes:
      label: 受影响模块
      description: 请填写 Manifest 技术名；不确定或涉及多个模块时逐一列出。
      placeholder: "例如：occ_treegrid / occ_example, occ_example_test / 不确定"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: 模块版本或提交
      description: 请填写 __manifest__.py 中的版本，或完整 Git commit SHA。
      placeholder: "例如：19.0.1.0.1 / abc123..."
    validations:
      required: true

  - type: input
    id: odoo_version
    attributes:
      label: Odoo 版本
      placeholder: "例如：19.0 Community，提交 SHA ..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 包括操作系统、Python、PostgreSQL、浏览器、部署方式和相关第三方模块。
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.12
        PostgreSQL: 16
        Browser: Chrome ...
        Deployment/addons: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、连续且可重复的步骤，以及必要的脱敏示例数据。
      placeholder: |
        1. 在全新测试数据库安装 ...
        2. 以 ... 用户打开 ...
        3. 执行 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或最小复现仓库
      description: 可粘贴脱敏日志或公开的最小复现仓库链接；请勿包含 AppSecret、token、OAuth code、验证链接或个人信息。

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或短视频
      description: 界面问题可以直接拖入脱敏截图或短视频；请确认图片中没有个人信息、凭据或生产数据。

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 包括复现频率、临时规避方式、最近正常版本等。
