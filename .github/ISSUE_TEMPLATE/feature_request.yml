name: 功能建议 / Feature Request
description: 建议新的业务能力或改进现有工作流
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先描述需要解决的业务问题，再说明建议方案。安全问题请改用 SECURITY.md 中的私密渠道。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 这不是安全漏洞或支持请求。
          required: true

  - type: input
    id: module
    attributes:
      label: 相关模块
      description: 请填写已有模块技术名；尚不存在时填写建议的新模块名或“跨模块”。
      placeholder: "例如：occ_wechat_login / occ_quality_trace（新模块） / 跨模块"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 业务问题与使用场景
      description: 谁在什么情况下遇到什么问题？现有行为为什么不足？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户流程、关键规则和期望结果；可以附草图或示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括当前临时方案、其他模块或不修改核心行为的实现方式。

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与风险
      description: 是否涉及数据迁移、权限、个人信息、外部 API、前端契约或生产升级？

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 可以提交 Pull Request
        - 可以协助测试或补充需求
        - 暂时无法参与实现
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充资料
      description: 可附公开规范或文档链接；请勿提交敏感信息或未经授权的素材。
